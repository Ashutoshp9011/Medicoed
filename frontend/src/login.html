<!DOCTYPE html> 
<html lang="en"> <head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Medicoed</title>
<link rel="stylesheet" href="login.css">
<script type="module" src="./script.ts"></script>

</head>
<body>
 <main class="box">


    <section class="internal">
      <a href="#" class="back">&larr; Go back</a>
     
<div class="heading">
    <p class="heading_large">Log in</p>
    <h1 class="heading_small">
        Continue learning with Medicoed.
    </h1>
</div>
     
 <form id="userForm" class="form">

  <input
    id="email"
    name="email"
    type="email"
    placeholder="Email address"
    required
    autocomplete="username"
  />

 <input
    id="password"
    name="password"
    type="password"
    placeholder="Password"
    required
    autocomplete="current-password"
  />

<label class="remember">
  <input type="checkbox" name="remember">
  Remember me
</label>

  <button type="submit">Login</button>

  <p id="formMessage" class="form__note" role="status"></p>
  <p class="form__note"> New here?<a href="./signup.html">Create account</a></p>

 </form>
</section>

 </main>

</body>
</html>
